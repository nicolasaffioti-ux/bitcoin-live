<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitcoin live</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#16181d;--mute:#6b6f78;--line:#e2e0da;--accent:#2a78d6;--up:#0c8a4f;--down:#c93a3a;--grid:rgba(107,111,120,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#181b20;--ink:#eceae4;--mute:#9a9ea8;--line:#2a2e35;--accent:#5a9df0;--up:#3fbf80;--down:#ec6a6a;--grid:rgba(154,158,168,.18)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:18px;font-weight:600;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.label{font-size:13px;color:var(--mute)}
.price{font-size:clamp(36px,10vw,56px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.chg{font-size:15px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.chart{position:relative;height:220px}
form{display:flex;gap:8px;margin-bottom:6px}
input[type=password]{flex:1;min-width:0;padding:9px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.btn{padding:9px 16px;font:inherit;font-size:15px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:4px 10px;font-size:13px}
.err{color:var(--down);font-size:13px;min-height:20px}
.rem{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-bottom:4px}
footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>Bitcoin</h1>
    <div class="seg" role="group" aria-label="Valuta">
      <button id="cUSD" aria-pressed="true">USD</button>
      <button id="cEUR" aria-pressed="false">EUR</button>
    </div>
  </header>

  <section id="keybox" class="card">
    <form id="kf">
      <input id="key" type="password" placeholder="Chiave API Finnhub" autocomplete="off" aria-label="Chiave API Finnhub">
      <button class="btn" type="submit">Collega</button>
    </form>
    <label class="rem"><input type="checkbox" id="remember"> Ricorda la chiave su questo dispositivo</label>
    <div class="err" id="kerr" role="alert"></div>
  </section>

  <section class="card">
    <div class="label">Prezzo attuale</div>
    <div class="price" id="price">--</div>
    <div class="chg" id="chg" style="color:var(--mute)">Inserisci la chiave per iniziare</div>
  </section>

  <div class="grid">
    <div class="card"><div class="label">Massimo del giorno</div><div class="val" id="hi">--</div></div>
    <div class="card"><div class="label">Minimo del giorno</div><div class="val" id="lo">--</div></div>
  </div>

  <section class="card">
    <div class="chart"><canvas id="ch" role="img" aria-label="Grafico del prezzo di Bitcoin durante la sessione"></canvas></div>
  </section>

  <footer>
    <span id="st">Non connesso</span>
    <button class="btn ghost" id="forget" hidden>Scollega</button>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var cur='USD',labels=[],vals=[],chart=null,timer=null,token='';
var $=function(i){return document.getElementById(i)};
function sym(){return cur==='USD'?'BINANCE:BTCUSDT':'BINANCE:BTCEUR'}
function fmt(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:cur,maximumFractionDigits:2}).format(v)}
function now(){return new Date().toLocaleTimeString('it-IT')}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function mk(){
  if(chart)chart.destroy();
  chart=new Chart($('ch'),{type:'line',
    data:{labels:labels,datasets:[{data:vals,borderColor:css('--accent'),backgroundColor:'transparent',borderWidth:2,pointRadius:0,tension:.25}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return fmt(c.parsed.y)}}}},
      scales:{x:{ticks:{maxTicksLimit:4,color:css('--mute')},grid:{display:false}},
              y:{ticks:{color:css('--mute'),callback:function(v){return Math.round(v).toLocaleString('it-IT')}},grid:{color:css('--grid')}}}}});
}

function stop(){clearInterval(timer);timer=null}

async function tick(){
  try{
    var r=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(sym())+'&token='+encodeURIComponent(token));
    if(r.status===401||r.status===403){
      stop();token='';
      try{localStorage.removeItem('fh_key')}catch(e){}
      $('keybox').hidden=false;$('forget').hidden=true;
      $('kerr').textContent='Chiave non valida o non autorizzata. Controllala e riprova.';
      $('st').textContent='Non connesso';return;
    }
    if(r.status===429){$('st').textContent='Troppe richieste, riprovo a breve';return}
    if(!r.ok)throw new Error('http');
    var d=await r.json();
    if(!d||!d.c){$('st').textContent='Nessun dato ricevuto per questo simbolo';return}
    $('kerr').textContent='';
    $('price').textContent=fmt(d.c);
    if(typeof d.dp==='number'){
      $('chg').textContent=(d.dp>=0?'+':'')+d.dp.toFixed(2)+'% oggi';
      $('chg').style.color=d.dp>=0?'var(--up)':'var(--down)';
    }
    $('hi').textContent=fmt(d.h);$('lo').textContent=fmt(d.l);
    labels.push(now());vals.push(d.c);
    if(vals.length>180){labels.shift();vals.shift()}
    chart.update();
    $('st').textContent='Dati Finnhub, aggiornato alle '+now();
  }catch(e){
    $('st').textContent='Connessione a Finnhub non riuscita, riprovo tra poco';
  }
}

function start(){
  stop();labels.length=0;vals.length=0;mk();
  $('cUSD').setAttribute('aria-pressed',cur==='USD');
  $('cEUR').setAttribute('aria-pressed',cur==='EUR');
  if(!token)return;
  $('keybox').hidden=true;$('forget').hidden=false;
  tick();timer=setInterval(tick,5000);
}

$('kf').addEventListener('submit',function(e){
  e.preventDefault();
  var v=$('key').value.trim();
  if(!v){$('kerr').textContent='Inserisci la chiave API prima di collegare.';return}
  token=v;$('key').value='';$('kerr').textContent='';
  try{if($('remember').checked)localStorage.setItem('fh_key',v)}catch(e){}
  start();
});
$('key').addEventListener('input',function(){$('kerr').textContent=''});
$('forget').addEventListener('click',function(){
  stop();token='';
  try{localStorage.removeItem('fh_key')}catch(e){}
  $('keybox').hidden=false;$('forget').hidden=true;
  $('price').textContent='--';$('chg').textContent='Inserisci la chiave per iniziare';$('chg').style.color='var(--mute)';
  $('hi').textContent='--';$('lo').textContent='--';$('st').textContent='Non connesso';
  labels.length=0;vals.length=0;mk();
});
$('cUSD').addEventListener('click',function(){cur='USD';start()});
$('cEUR').addEventListener('click',function(){cur='EUR';start()});

try{var saved=localStorage.getItem('fh_key');if(saved){token=saved;$('remember').checked=true}}catch(e){}
start();
</script>
</body>
</html>
